    privacy:
      summary: Özet
      summary_description: >-
        <p>Bu gizlilik politikası, bu web sitesi için geçerlidir ve siteyi kullanan
        kişilerin gizliliğine ilişkin esasları belirler. </p><p>Sitedeki içeriklerin
        hassasiyeti nedeniyle gizliliğe büyük önem veriyoruz. Bu politika, kullanıcı
        verilerinin nasıl toplandığını, hangi amaçlarla kullanıldığını ve nasıl
        korunduğunu açıklar.</p>
      user_data: Kullanıcı verileri
      user_data_description: >-
        <p>Bu web sitesinin özellikleri hakkında daha fazla bilgiyi %{faq_link}
        sayfamızda bulabilirsiniz.</p>
      data_protection_rights: Kişisel verilerin korunmasına ilişkin haklar
      data_protection_rights_answer: >-
        <p>Her kullanıcı aşağıdaki haklara sahiptir:</p><p>Erişim hakkı – Kullanıcılar,
        kişisel verilerinin bir kopyasını bizden talep edebilir. Bu hizmet için küçük
        bir ücret alabiliriz.</p><p>Düzeltme hakkı – Kullanıcılar, yanlış olduğunu
        düşündükleri bilgilerin düzeltilmesini talep edebilir. Eksik olduğunu
        düşündükleri bilgilerin tamamlanmasını da isteyebilirler.</p><p>Silme hakkı –
        Kullanıcılar, belirli koşullar altında kişisel verilerinin silinmesini talep
        edebilir.</p><p>İşlemeyi kısıtlama hakkı – Kullanıcılar, belirli koşullar
        altında kişisel verilerinin işlenmesinin kısıtlanmasını talep
        edebilir.</p><p>İşlemeye itiraz hakkı – Kullanıcılar, belirli koşullar altında
        kişisel verilerini işlememize itiraz edebilir.</p><p>Veri taşınabilirliği hakkı
        – Kullanıcılar, belirli koşullar altında topladığımız verilerin başka bir
        kuruluşa veya doğrudan kendilerine aktarılmasını talep edebilir.</p><p>Bir
        talepte bulunmanız hâlinde size bir ay içinde yanıt veririz.</p>
      cookies: Çerez kullanımı
      cookies_description: >-
        <p>Bu web sitesi, ziyaretiniz sırasında kullanıcı deneyimini iyileştirmek için
        çerezler kullanır. İşlevsel çerezler, kimlik doğrulamak ve daha önce seçilen
        tercihleri hatırlamak için kullanılır. Bu tercihler, seçtiğiniz dili ve
        bulunduğunuz konumu içerebilir. Gerektiğinde, siteye ilk ziyaretinizde
        bilgisayarınızda veya cihazınızda çerez kullanımına izin vermenizi ya da
        reddetmenizi sağlayan bir çerez yönetim sistemi kullanılır.</p><p>Çerezler,
        kullanıcının bilgisayarının sabit diskine kaydedilen küçük dosyalardır.
        Kullanıcının web sitesiyle etkileşimi ve siteyi kullanımı hakkındaki bilgileri
        takip eder, kaydeder ve saklar. Böylece web sitesi, sunucusu aracılığıyla
        kullanıcılara site içinde kişiselleştirilmiş bir deneyim sunabilir.</p><p> Bu
        web sitesinin çerez kullanmasını ve bilgisayarınızın sabit diskine çerez
        kaydetmesini istemiyorsanız, tarayıcınızın güvenlik ayarlarından bu web
        sitesinin ve siteye dışarıdan hizmet sağlayan kuruluşların tüm çerezlerini
        engelleyebilirsiniz.</p>
      social_media: Sosyal medya platformları
      social_media_description: >-
        <p>Bu web sitesinin yer aldığı haricî sosyal medya platformları üzerinden
        gerçekleştirilen iletişim, etkileşim ve işlemler, ilgili sosyal medya
        platformunun kendi kullanım koşullarına ve gizlilik politikasına tabidir.</p>
      changes: Değişiklikler
      changes_description: >-
        <p>Gizlilik politikamızı düzenli olarak gözden geçirir ve güncellemeleri bu
        sayfada yayımlarız. Kanada'daki Kişisel Bilgilerin Korunması ve Elektronik
        Belgeler Yasası (PIPEDA) ile Avrupa Birliği Genel Veri Koruma Tüzüğü'ne (GDPR
        EU) uyum sağlarız.</p><p>Bu gizlilik politikası en son 11 Şubat 2024 tarihinde
        güncellenmiştir.</p>
      contact: Bize ulaşın
      contact_description: >-
        <p class="noMarginBottom">Sorularınız veya kaygılarınız varsa lütfen
        %{email_link}.</p>
