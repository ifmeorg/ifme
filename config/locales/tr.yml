        unutmayın!</p>
      more_contributors: Katkıda bulunan diğer harika insanlar!
      thanks: Katkıları için çok teşekkür ederiz
      slack: Slack
    faq:
      title: Sıkça sorulan sorular
      data_access_question: Verilerime kimler erişebilir?
      data_access_answer: >-
        Verileriniz üçüncü taraflara verilmez ve erişimlerine açılmaz. Hesabınızı
        sildiğinizde tüm verileriniz de silinir.<br /><br />Size özel öneriler sunmak
        için kullanıcı verileri site içinde analiz edilir.<br /><br />Kullanıcı hesabı
        oluşturmak için ad ve e-posta adresi gereklidir. Facebook veya Google ile giriş
        yapan kullanıcıların profil fotoğrafı ve adı hesaplarında kullanılır.
      moment_question: An nedir?
      moment_answer: >-
        <strong>%{moment}</strong>, ruh sağlığınızı etkileyen bir olay veya durumdur.
        Olumlu da olabilir, olumsuz da. Bunu bir günlük yazısı veya durum paylaşımı gibi
        düşünebilirsiniz.<br /><br />Anlarınızı baş etme yolları, kategoriler ve ruh
        hâlleriyle etiketleyebilirsiniz. Hangi destekçilerin görebileceğini ve yorum
        yapabileceğini de seçebilirsiniz. İsterseniz anlarınızı yalnızca siz
        görebilirsiniz.<br /><br /><strong>%{moment_templates}</strong> ile yazarken
        size yol gösterecek, tekrar kullanabileceğiniz şablonlar oluşturabilirsiniz.
      strategy_question: Baş etme yolu nedir?
      strategy_answer: >-
        <strong>%{strategy}</strong>, zorluklarla baş etmenize veya iyileşmeye
        odaklanmanıza yardımcı olan bir etkinlik, düşünce biçimi ya da öz bakım
        uygulamasıdır.<br /><br />Baş etme yollarınızı kategorilerle
        etiketleyebilirsiniz. Hangi destekçilerin görebileceğini ve yorum yapabileceğini
        de seçebilirsiniz. İsterseniz baş etme yollarınızı yalnızca siz görebilirsiniz.
        Paylaşılan baş etme yolları, seçilen tüm destekçiler tarafından görülebilir.
        Böylece anlarınızı destekçilerinizin baş etme yollarıyla da
        etiketleyebilirsiniz!
      category_question: Kategori nedir?
      category_answer: >-
        <strong>%{category}</strong>, sizin için önemli olan kişileri, yerleri ve
        şeyleri temsil edebilen bir etikettir.
      mood_question: Ruh hâli nedir?
      mood_answer: >-
        <strong>%{mood}</strong>, düşüncelerinizi ve duygularınızı ifade eden bir
        etikettir.
      group_question: Grup nedir?
      group_answer: >-
        <strong>%{group}</strong>, ruh sağlığı konusunda destek, rehberlik ve fikir
        alışverişi olanağı sunar. Gruplar oluşturabilirsiniz; destekçileriniz de bu
        gruplara katılabilir. Yalnızca destekçilerinizin oluşturduğu gruplara
        katılabilirsiniz.<br /><br />Grup yöneticisi olarak <strong>buluşmalar</strong>
        oluşturabilirsiniz. Buluşmaların bir yeri ve zamanı vardır. Buluşma yeri bir
        açık adres veya görüntülü görüşme bağlantısı olabilir. Buluşmalara yorum da
        yapılabilir. Grup yöneticisiyseniz başka bir yönetici olmadığı sürece gruptan
        ayrılamazsınız. Bir grubu ancak grubun tek üyesi sizseniz silebilirsiniz.
      medications_question: İlaçlar özelliğini nasıl kullanabilirim?
      medications_answer: >-
        <strong>%{medications}</strong> özelliğiyle kullandığınız reçeteli ilaçları
        kaydedebilirsiniz. Belirtilerinizi de not edebilirsiniz.
      care_plan_question: Bakım planı özelliğini nasıl kullanabilirim?
      care_plan_answer: >-
        <strong>%{care_plan}</strong> özelliğiyle zor zamanlarda ulaşabileceğiniz
        sevdiklerinizin listesini tutabilir ve size iyi gelen baş etme yollarını yer
        imlerine ekleyebilirsiniz.
      invite_question: Sevdiklerimi uygulamaya katılmaya nasıl davet edebilirim?
      invite_answer: >-
        <strong>%{allies}</strong> sayfasına gidip "Sevdiklerinizi davet edin"
        bağlantısına tıklayın. Onları e-postayla davet edebilirsiniz. Davetinizi kabul
        ettiklerinde destekçiler listenize eklenirler.
      email_notifications_question: E-posta bildirimlerini nasıl değiştirebilirim?
      email_notifications_answer: >-
        <strong>%{accounts}</strong> sayfasına gidin. Buradan e-posta adresinizi,
        parolanızı, profil fotoğrafınızı ve kendinizi tanıtan yazıyı
        değiştirebilirsiniz. Hesabınızı da silebilirsiniz. Hesabınızı sildiğinizde tüm
        verileriniz silinir.
