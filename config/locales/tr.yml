      bookmarked_info: Yer imlerine eklediğiniz baş etme yolları bakım planınızda görünür
    label:
      one: 'Baş etme yolu:'
      other: 'Baş etme yolları:'
    index:
      subtitle: >-
        Anlarınıza dair geliştirmek istediğiniz düşünce ve tutumlar için öz bakımınızı
        destekleyen baş etme yolları oluşturun.
      premade1_name: Beş dakikalık meditasyon
      premade1_description: >-
        1) <b>Rahat bir pozisyon bulun.</b> Bir sandalyeye veya yerde bir mindere
        oturabilirsiniz. Sırtınızı dik tutun, ancak kendinizi fazla kasmayın. Ellerinizi
        rahat ettikleri bir yere bırakın. Diliniz damağınızda veya rahat hissettiğiniz
        bir konumda olsun. <br /><br />2)<b>Bedeninizi fark edin ve gevşetin.</b>
        Bedeninizin duruşunu ve ağırlığını fark etmeye çalışın. Gevşemeye izin verin ve
        burada oturan bedeninize merakla yaklaşın; hissettiklerini, temas ettiği
        yerleri, zeminle veya sandalyeyle kurduğu bağı fark edin. Kasılmış ya da gergin
        bölgeleri gevşetin. Yalnızca nefes alın.<br /><br />3) <b>Dikkatinizi nefesinize
        verin.</b> Nefesinizin doğal akışını, alıp verişinizi hissedin. Nefesinizi
        değiştirmeniz gerekmiyor. Uzun ya da kısa olmasına çalışmadan, doğal hâliyle
        bırakın. Nefesi bedeninizin neresinde hissettiğinizi fark edin. Karnınızda,
        göğsünüzde, boğazınızda veya burun deliklerinizde olabilir. Her nefesin
        yarattığı duyumları tek tek fark etmeye çalışın. Bir nefes bittiğinde diğeri
        başlar.<br /><br />4) <b>Dikkatiniz dağıldığında kendinize nazik davranın.</b>
        Bu sırada zihninizin başka yerlere gittiğini fark edebilirsiniz. Başka şeyler
        düşünmeye başlayabilirsiniz. Bunda bir sorun yok; bu çok doğal. Yalnızca
        dikkatinizin dağıldığını fark edin. İçinizden yumuşakça “düşünüyorum” veya
        “dikkatim dağıldı” diyebilirsiniz. Sonra dikkatinizi nazikçe yeniden nefesinize
        yöneltin. <br /><br />5) <b>Beş ila yedi dakika bu şekilde kalın. </b> Sessizce
        nefesinizi fark edin. Zaman zaman düşüncelere dalabilirsiniz; ardından yeniden
        nefesinize dönün.<br /><br />6) <b>Bitirmeden önce nasıl olduğunuzu fark edin.
        </b> Birkaç dakika sonra burada oturan bedeninizi, tüm bedeninizi yeniden fark
        edin. Biraz daha gevşemeye izin verin ve bugün bu uygulamaya zaman ayırdığınız
        için kendinize teşekkür edin. <br /><br /><i>Kaynak:
        http://www.mindful.org/a-five-minute-breathing-meditation/ </i>
      instructions: >-
        Henüz kendinize özel bir baş etme yolu oluşturmadınız.<br />Aşağıdaki hazır baş
        etme yolunu da ekleyebilir, daha sonra kendinize göre düzenleyebilirsiniz.
