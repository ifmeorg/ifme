  strategies:
    singular: Baş etme yolu
    plural: Baş etme yolları
    edit_strategy: Baş etme yolunu düzenleyin
    tagged_strategies: Etiketlenen baş etme yolları
    new: Yeni baş etme yolu
    form:
      describe: Baş etme yolunu açıklayın.
      strategies_label: Bu düşüncelere ulaşmanıza hangi baş etme yolları yardımcı olabilir?
      name_hint: 'Size iyi gelen herhangi bir etkinlik, düşünce biçimi veya öz bakım uygulaması'
      viewers_hint: Baş etme yolunuzu görebilecek ve kendi anlarını bununla etiketleyebilecek destekçiler
      daily_reminder_hint: Bu baş etme yolunu uygulamanız için size her gün bir hatırlatma e-postası göndereceğiz
      draft_question: Baş etme yolunuzu taslak olarak kaydetmek ister misiniz?
