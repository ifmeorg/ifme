  pages:
    about:
      main_message_one: >-
        %{app_name}, insanları kişisel deneyimlerini güvendikleri destekçilerle
        paylaşmaya teşvik eden bir ruh sağlığı topluluğudur.
      message_text_one: >-
        Güvendiğimiz destekçiler; arkadaşlarımız, aile üyelerimiz, iş arkadaşlarımız,
        öğretmenlerimiz ve ruh sağlığı çalışanları gibi günlük yaşamımızda iletişim
        kurduğumuz kişilerdir.
      main_message_two: >-
        Ruh sağlığımızla ilgilenmek insan olmanın bir parçasıdır. Ancak pek çoğumuz için
        bu konuda açıkça konuşmak zordur.
      message_text_two: >-
        Herkes psikolojik danışman ya da terapist değildir. Günlük yaşamda iletişim
        kurduğumuz insanlar duygularımızı ve davranışlarımızı etkiler. Onların ruh
        sağlığı tedavisine destek olması, iyileşme sürecinin önemli bir parçasıdır.
      message_text_three: >-
        <strong>Bize maddi destek vermek ister misiniz?</strong> 2016 yılında Linebreak
        topluluk hibesi aldık. 2017 yılında %{fund_club_link} tarafından desteklendik.
        %{open_collective_link} sayfamızdan bağış yaparak bize destek olabilirsiniz.
      fund_club: Fund Club
    blog:
      description: >-
        Bizim için yazmak isterseniz fikirlerinizi %{email} adresine gönderin! İsminizi
