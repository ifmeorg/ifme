    contribute:
      contributor_avatar_alt: 'Katkıda bulunan %{name} hakkında'
      message_text_one: >-
        <strong>Ruh sağlığı savunucuları</strong>, <strong>sağlık çalışanları</strong>,
        <strong>yazılım geliştiricileri</strong>, <strong>çevirmenler</strong> ve
        <strong>kullanıcı deneyimi tasarımcıları</strong> dâhil herkesin fikirlerine
        açığız! <p class="noMarginBottom">Lütfen %{email_link}, sizinle iletişime
        geçelim! Temel iletişim aracımız olan %{slack_link} kanalımıza davet
