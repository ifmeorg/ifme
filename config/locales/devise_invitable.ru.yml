ru:
  devise:
    failure:
      invited: >-
        У вас есть приглашение, которое ждёт ответа. Примите его, чтобы
        завершить создание аккаунта.
    invitations:
      send_instructions: 'Приглашение отправлено на %{email}.'
      failed_send: 'Что-то пошло не так. Не удалось пригласить %{email}.'
      invitation_token_invalid: 'Код приглашения недействителен!'
      updated: 'Пароль задан. Вы вошли в аккаунт.'
      updated_not_active: 'Пароль задан.'
      no_invitations_remaining: 'Приглашения закончились'
      invitation_removed: 'Ваше приглашение удалено.'
      new:
        header: 'Пригласить союзника'
        submit_button: 'Отправить приглашение'
      edit:
        header: 'Задайте пароль'
        submit_button: 'Сохранить пароль'
    mailer:
      invitation_instructions:
        subject: 'if-me.org | %{name} приглашает вас в if-me.org!'
        subject_nameless: 'if-me.org | Вас приглашают в if-me.org!'
        hello: 'Здравствуйте, %{email}!'
        someone_invited_you: >-
          %{name} приглашает вас в http://www.if-me.org — сообщество, где можно
          делиться опытом, связанным с психическим здоровьем, с близкими людьми
          и следить за своим настроением, лекарствами и заботой о себе. Принять
          приглашение можно по ссылке ниже.
        accept: 'Принять приглашение!'
        accept_until: 'Приглашение действует до %{due_date}.'
        ignore: >-
          Если вы не хотите принимать приглашение, просто проигнорируйте это
          письмо.<br/>Аккаунт не будет создан, пока вы не перейдёте по ссылке
          выше и не зададите пароль.
