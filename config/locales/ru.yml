    index:
      subtitle: >-
        Продумывайте способы заботы о себе, которые помогут по-новому взглянуть
        на ваши моменты.
      premade1_name: 'Пятиминутная медитация'
      premade1_description: >-
        1) <b>Сядьте удобно и расслабленно.</b> Можно сесть на стул или на
        подушку на полу. Держите спину прямо, но без напряжения. Положите руки
        так, как вам удобно. Язык — у нёба или там, где ему удобно. <br /><br
        />2)<b>Заметьте своё тело и расслабьте его.</b> Попробуйте почувствовать
        форму своего тела, его вес. Позвольте себе расслабиться и с любопытством
        понаблюдать за телом — за ощущениями, которые оно испытывает, за
        прикосновениями, за контактом с полом или стулом. Расслабьте места, где
        чувствуется скованность или напряжение. Просто дышите.<br /><br />3)
        <b>Настройтесь на дыхание.</b> Почувствуйте естественный ход дыхания —
        вдох, выдох. С дыханием ничего не нужно делать. Не длинное, не короткое
        — просто естественное. Заметьте, где в теле вы чувствуете дыхание.
        Может быть, в животе. Может быть, в груди, в горле или в ноздрях.
        Попробуйте почувствовать ощущения дыхания, по одному вдоху за раз. Когда
        заканчивается один вдох, начинается следующий.<br /><br />4) <b>Будьте
        добры к своему блуждающему уму.</b> Пока вы это делаете, вы можете
        заметить, что мысли начинают блуждать. Вы можете начать думать о чём-то
        другом. Если так случится, ничего страшного. Это совершенно естественно.
        Просто заметьте, что мысли ушли в сторону. Можно мягко сказать про себя
        «думаю» или «отвлекаюсь». А затем бережно верните внимание обратно к
        дыханию. <br /><br />5) <b>Побудьте так пять–семь минут. </b> Наблюдайте
        за дыханием в тишине. Время от времени вы будете теряться в мыслях, а
        потом возвращаться к дыханию.<br /><br />6) <b>Прежде чем закончить,
        прислушайтесь к себе. </b> Через несколько минут снова заметьте своё
        тело — всё тело, сидящее здесь. Позвольте себе расслабиться ещё глубже,
        а затем поблагодарите себя за то, что сегодня выполнили эту практику.
        <br /><br /><i>Источник:
        http://www.mindful.org/a-five-minute-breathing-meditation/ </i>
      instructions: >-
        Вы пока не создали своих стратегий.<br />Можно добавить готовую
        стратегию ниже и настроить её позже.
