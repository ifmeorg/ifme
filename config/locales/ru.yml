    privacy:
      summary: 'Кратко'
      summary_description: >-
        <p>Эта политика конфиденциальности относится к этому сайту и
        регулирует защиту конфиденциальности пользователей, которые решили им
        пользоваться. </p><p>Сайт затрагивает очень личные темы, поэтому
        конфиденциальность для нас невероятно важна. Политика описывает, как
        собираются данные пользователей, для чего они используются и как
        защищаются.</p>
      user_data: 'Данные пользователей'
      user_data_description: >-
        <p>Подробнее о возможностях сайта — на странице
        «%{faq_link}».</p>
      data_protection_rights: 'Права на защиту данных'
      data_protection_rights_answer: >-
        <p>У каждого пользователя есть следующие права:</p><p>Право на доступ –
        пользователи могут запросить у нас копии своих персональных данных. За
        эту услугу мы можем взять небольшую плату.</p><p>Право на исправление –
        пользователи могут попросить нас исправить информацию, которую они
        считают неточной. Также они могут попросить нас дополнить информацию,
        которую они считают неполной.</p><p>Право на удаление – пользователи
        могут попросить нас удалить их персональные данные при определённых
        условиях.</p><p>Право на ограничение обработки – пользователи могут
        попросить нас ограничить обработку их персональных данных при
        определённых условиях.</p><p>Право на возражение против обработки –
        пользователи могут возразить против обработки их персональных данных
        при определённых условиях.</p><p>Право на переносимость данных –
        пользователи могут попросить нас передать собранные данные другой
        организации или им самим при определённых условиях.</p><p>Если вы
        отправите запрос, мы ответим вам в течение месяца.</p>
      cookies: 'Использование файлов cookie'
      cookies_description: >-
        <p>Этот сайт использует файлы cookie, чтобы пользователям было удобнее
        им пользоваться. Функциональные файлы cookie нужны для входа в аккаунт
        и для того, чтобы запоминать выбранные ранее настройки — например,
        предпочитаемый язык и ваше местоположение. Где это применимо, сайт
        использует систему управления файлами cookie: при первом посещении
        пользователь может разрешить или запретить их использование на своём
        компьютере или устройстве.</p><p>Файлы cookie — это небольшие файлы,
        которые сохраняются на жёстком диске компьютера пользователя и
        записывают, сохраняют и хранят информацию о том, как пользователь
        взаимодействует с сайтом. Благодаря этому сайт через свой сервер может
        подстраиваться под пользователя.</p><p> Если пользователи не хотят,
        чтобы этот сайт использовал и сохранял файлы cookie на их компьютерах,
        им нужно заблокировать все файлы cookie этого сайта и его внешних
        поставщиков в настройках безопасности своего браузера.</p>
      social_media: 'Социальные сети'
      social_media_description: >-
        <p>Общение, взаимодействие и действия во внешних социальных сетях, в
        которых участвует этот сайт, регулируются условиями использования и
        политиками конфиденциальности каждой из этих социальных сетей.</p>
      changes: 'Изменения'
      changes_description: >-
        <p>Мы регулярно пересматриваем нашу политику конфиденциальности и
        публикуем все изменения на этой странице. Мы соблюдаем канадский Закон
