  pages:
    about:
      main_message_one: >-
        %{app_name} — это сообщество, где люди делятся опытом, связанным с
        психическим здоровьем, и рассказывают свои истории союзникам, которым
        доверяют.
      message_text_one: >-
        Союзники, которым мы доверяем, — это люди, с которыми мы общаемся
        каждый день: друзья, родные, коллеги, учителя и специалисты в области
        психического здоровья.
      main_message_two: >-
        Забота о психическом здоровье — часть того, что делает нас людьми. Но
        многим из нас трудно говорить об этом открыто.
      message_text_two: >-
        Не каждый из нас — психолог или психотерапевт. Люди, с которыми мы
        общаемся каждый день, влияют на наши эмоции и поведение. Вовлечь их в
        заботу о психическом здоровье — ключ к восстановлению.
      message_text_three: >-
        <strong>Хотите поддержать нас финансово?</strong> В 2016 году мы
        получили грант для сообществ от Linebreak. В 2017 году нас поддержал
        %{fund_club_link}. Вы можете помочь нам, сделав пожертвование через
        %{open_collective_link}.
      fund_club: Fund Club
    blog:
      description: >-
        Хотите писать для нас? Присылайте свои идеи на %{email}! Анонимные
        тексты тоже приветствуются.
    contribute:
      contributor_avatar_alt: 'Биография участника проекта %{name}'
      message_text_one: >-
        Мы всегда рады идеям от всех, в том числе от <strong>активистов в сфере
        психического здоровья</strong>, <strong>медицинских специалистов</strong>,
        <strong>разработчиков</strong>, <strong>переводчиков</strong> и
        <strong>UX-дизайнеров</strong>! <p class="noMarginBottom">Пожалуйста,
        %{email_link} — и мы с вами свяжемся! Мы пригласим вас в наш
        %{slack_link} — это наш основной инструмент общения. И обязательно
        сделайте форк нашего репозитория на %{github_link}!</p>
      more_contributors: 'Ещё больше замечательных участников проекта!'
      thanks: 'Огромное спасибо'
      slack: Slack
    faq:
      title: 'Частые вопросы'
      data_access_question: 'У кого есть доступ к моим данным?'
      data_access_answer: >-
        Мы не передаём данные третьим лицам и не открываем к ним доступ. Если
        удалить аккаунт, удалятся все ваши данные.<br /><br />Данные
        пользователей анализируются внутри сайта, чтобы давать персональные
        рекомендации.<br /><br />Чтобы создать аккаунт, нужны имя и адрес
        электронной почты. Если пользователь входит через Facebook или Google,
        в его аккаунте будут использоваться фото профиля и имя оттуда.
      moment_question: 'Что такое момент?'
      moment_answer: >-
        <strong>%{moment}</strong> — это событие или ситуация, которые влияют
        на ваше психическое здоровье. Это может быть что-то хорошее или плохое.
        Можно считать момент записью в дневнике или обновлением статуса.<br
        /><br />Моменты можно отмечать стратегиями, категориями и настроениями.
        Также можно выбрать, кто из союзников сможет их видеть и комментировать,
        или сделать моменты видимыми только для вас.<br /><br
        /><strong>%{moment_templates}</strong> помогают создавать подсказки для
        записей, которые можно использовать снова и снова.
      strategy_question: 'Что такое стратегия?'
      strategy_answer: >-
        <strong>%{strategy}</strong> — это занятие, ход мыслей или способ
        заботы о себе, который помогает вам справляться с трудностями или
        сосредоточиться на восстановлении.<br /><br />Стратегии можно отмечать
        категориями. Также можно выбрать, кто из союзников сможет их видеть и
        комментировать, или сделать стратегии видимыми только для вас. Общие
        стратегии видны всем выбранным союзникам — а значит, вы тоже можете
        отмечать свои моменты стратегиями союзников!
      category_question: 'Что такое категория?'
      category_answer: >-
        <strong>%{category}</strong> — это тег для людей, мест и вещей, которые
        важны для вас.
      mood_question: 'Что такое настроение?'
      mood_answer: >-
        <strong>%{mood}</strong> — это тег, который описывает ваше состояние,
        чувства и эмоции.
      group_question: 'Что такое группа?'
      group_answer: >-
        <strong>%{group}</strong> — это место для поддержки, наставничества и
        обсуждений на тему психического здоровья. Вы можете создавать группы, а
        ваши союзники — вступать в них. Вступить можно только в группы,
        созданные вашими союзниками.<br /><br />Организаторы группы могут
        создавать <strong>встречи</strong>. У встречи есть место и время: это
        может быть адрес или ссылка на видеоконференцию. Встречи тоже можно
        комментировать. Организатор не может выйти из группы, пока в ней нет
        другого организатора. Удалить группу можно, только если в ней, кроме
        вас, никого нет.
      medications_question: 'Как пользоваться разделом «Лекарства»?'
      medications_answer: >-
        Раздел <strong>%{medications}</strong> позволяет записывать рецептурные
        лекарства, которые вы принимаете. Можно также отмечать симптомы.
      care_plan_question: 'Как пользоваться разделом «План заботы»?'
      care_plan_answer: >-
        Раздел <strong>%{care_plan}</strong> позволяет составить список
        близких, к которым можно обратиться в трудную минуту, и сохранить в
        закладках любимые стратегии заботы о себе.
      invite_question: 'Как пригласить близких в приложение?'
      invite_answer: >-
        Откройте страницу <strong>%{allies}</strong> и нажмите ссылку
        «Пригласите близких». Вы сможете пригласить их по электронной почте.
        Когда близкий человек примет приглашение, он появится в вашем списке
        союзников.
      email_notifications_question: 'Как изменить уведомления на почту?'
      email_notifications_answer: >-
        Откройте страницу <strong>%{accounts}</strong>. Здесь можно изменить
        адрес почты, пароль, фото профиля и информацию о себе, а также удалить
        аккаунт. После удаления аккаунта все ваши данные будут удалены.
