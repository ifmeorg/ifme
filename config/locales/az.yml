  omniauth:
    access_denied: Girişə icazə verilmir
  pages:
    about:
      main_message_one: >-
        %{app_name} insanları şəxsi hekayələrini etibar etdikləri dəstəkçilərlə
        bölüşməyə həvəsləndirən, psixoloji rifahla bağlı təcrübələrin paylaşıldığı icmadır.
      message_text_one: >-
        Etibar etdiyimiz dəstəkçilər hər gün ünsiyyətdə olduğumuz insanlardır.
        Onların arasında dostlar, ailə üzvləri, iş yoldaşları, müəllimlər və
        psixoloji dəstək göstərən mütəxəssislər də var.
      main_message_two: >-
        Psixoloji rifahımızın qayğısına qalmaq insan olmağın bir hissəsidir.
        Amma bir çoxumuz üçün bu barədə açıq danışmaq çətindir.
      message_text_two: >-
        Hər kəs məsləhətçi və ya psixoloq deyil. Hər gün ünsiyyətdə olduğumuz
        insanlar hisslərimizə və davranışlarımıza təsir edir. Onların psixoloji
        dəstək prosesində iştirakı özümüzü daha yaxşı hiss etməyimizə kömək edir.
      message_text_three: >-
        <strong>Bizə maddi dəstək olmaq istəyirsən?</strong> 2016-cı ildə Linebreak
        bizə icma qrantı ayırdı. 2017-ci ildə %{fund_club_link} vasitəsilə maliyyə
        dəstəyi aldıq. %{open_collective_link} səhifəmizdə ianə edərək
        bizə dəstək ola bilərsən.
      fund_club: Fund Club
    blog:
      description: >-
        Bizim üçün yazmaq istəyirsənsə, təklifini %{email} ünvanına göndər!
        Anonim yazıları da məmnuniyyətlə qəbul edirik.
    contribute:
      contributor_avatar_alt: '%{name} adlı töhfə verənin tərcümeyi-halı'
      message_text_one: >-
        Hər kəsin, o cümlədən <strong>psixoloji rifahı dəstəkləyənlərin</strong>,
        <strong>sağlamlıq mütəxəssislərinin</strong>, <strong>proqramçıların</strong>,
        <strong>tərcüməçilərin</strong> və <strong>istifadəçi təcrübəsi dizaynerlərinin</strong>
        fikirlərini həmişə gözləyirik! <p
        class="noMarginBottom">Zəhmət olmasa, %{email_link} və səninlə əlaqə saxlayaq!
        Əsas ünsiyyət vasitəmiz olan %{slack_link} səhifəmizə dəvət ediləcəksən.
        %{github_link} üzərindəki repozitoriyamızın öz nüsxəsini yaratmağı da unutma!</p>
      more_contributors: Digər gözəl töhfə verənlər!
      thanks: Dərin təşəkkürümüzü bildiririk
      slack: Slack
    faq:
      title: Tez-tez verilən suallar
      data_access_question: Məlumatlarıma kimlərin çıxışı var?
      data_access_answer: >-
        Məlumatlar heç bir üçüncü tərəfə verilmir və ya əlçatan edilmir. Hesabını
        sildikdə bütün məlumatların silinir.<br /><br />Fərdi tövsiyələr vermək
        üçün istifadəçi məlumatları sayt daxilində təhlil edilir.<br /><br
        />İstifadəçi hesabı yaratmaq üçün ad və e-poçt ünvanı tələb olunur.
        İstifadəçi Facebook və ya Google vasitəsilə daxil olarsa, onun profil
        şəkli və adı hesabında istifadə olunur.
      moment_question: An nədir?
      moment_answer: >-
        <strong>%{moment}</strong> psixoloji rifahına təsir edən hadisə və ya
        vəziyyətdir. Xoş və ya çətin ola bilər. Bunu gündəlik qeydi və ya
        vəziyyətin haqqında bir paylaşım kimi düşün.<br /><br />Anlarını
        üsullar, kateqoriyalar və əhvallarla etiketləyə bilərsən. Hansı
        dəstəkçilərin baxa və şərh yaza biləcəyini də seçə bilərsən. Anlarını
        yalnız özünə görünən edə bilərsən.<br
        /><br /><strong>%{moment_templates}</strong> təkrar istifadə edə biləcəyin
        yazı sualları yaratmağa imkan verir.
      strategy_question: Üsul nədir?
      strategy_answer: >-
        <strong>%{strategy}</strong> çətinliklərin öhdəsindən gəlməyə və ya özünü
        daha yaxşı hiss etməyə kömək edən fəaliyyət, düşüncə tərzi və ya özünə
        qayğı formasıdır.<br /><br />Üsulları kateqoriyalarla etiketləyə bilərsən.
        Hansı dəstəkçilərin baxa və şərh yaza biləcəyini də seçə bilərsən.
        Üsulları yalnız özünə görünən edə bilərsən. Paylaşılan üsullar seçilmiş
        bütün dəstəkçilərə görünəcək. Beləliklə, anlarını onların üsulları ilə
        də etiketləyə bilərsən!
      category_question: Kateqoriya nədir?
      category_answer: >-
        <strong>%{category}</strong> sənin üçün önəmli insanları,
        məkanları və əşyaları ifadə edə bilən etiketdir.
      mood_question: Əhval nədir?
      mood_answer: >-
        <strong>%{mood}</strong> düşüncələrini, hisslərini və
        duyğularını təsvir edən etiketdir.
      group_question: Qrup nədir?
      group_answer: >-
        <strong>%{group}</strong> psixoloji rifahla bağlı dəstək, yol göstərmə və
        müzakirə imkanı yaradır. Qruplar yarada bilərsən, dəstəkçilərin də onlara
        qoşula bilər. Yalnız dəstəkçilərinin yaratdığı qruplara qoşula bilərsən.<br
        /><br />Qrup rəhbəri kimi <strong>görüşlər</strong> yarada bilərsən.
        Görüşlərin məkanı və vaxtı olur. Məkan küçə ünvanı və ya videogörüş
        keçidi ola bilər. Görüşlərə şərh də yazmaq olar. Qrup rəhbərisənsə,
        başqa bir rəhbər olmadan qrupdan ayrıla bilməzsən.
        Qrupları yalnız yeganə üzv sən olduqda silmək olar.
      medications_question: Dərmanlar funksiyasından necə istifadə edim?
      medications_answer: >-
        <strong>%{medications}</strong> funksiyası qəbul etdiyin reseptli
        dərmanları qeyd etməyə imkan verir. Hiss etdiyin əlamətləri də yaza bilərsən.
      care_plan_question: Qayğı planı funksiyasından necə istifadə edim?
      care_plan_answer: >-
        <strong>%{care_plan}</strong> funksiyası çətin vaxtlarda əlaqə saxlaya
        biləcəyin sevdiklərinin siyahısını tutmağa və bəyəndiyin özünə qayğı
        üsullarını seçilmişlərə əlavə etməyə imkan verir.
      invite_question: Sevdiklərimi tətbiqə qoşulmağa necə dəvət edim?
      invite_answer: >-
        <strong>%{allies}</strong> səhifəsinə keç və "Sevdiklərini dəvət et"
        keçidinə kliklə. Onları e-poçtla dəvət edə biləcəksən. Sevdiyin insan
        dəvəti qəbul etdikdə dəstəkçilər siyahına əlavə olunacaq.
      email_notifications_question: E-poçt bildirişlərini necə dəyişə bilərəm?
      email_notifications_answer: >-
        <strong>%{accounts}</strong> səhifəsinə keç. Burada e-poçt ünvanını,
        parolunu, profil şəklini və özün haqqında məlumatı dəyişə bilərsən.
        Hesabını da silə bilərsən. Hesabını sildikdə bütün məlumatların silinir.
