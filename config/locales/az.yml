        bizə %{email} ünvanına yaz.
    privacy:
      summary: Xülasə
      summary_description: >-
        <p>Bu məxfilik siyasəti bu veb-sayta aiddir və ondan istifadə etməyi
        seçən istifadəçilərin məxfiliyini tənzimləyir. </p><p>Saytın həssas
        məzmununu nəzərə alaraq, məxfilik bizim üçün son dərəcə önəmlidir.
        Bu siyasət istifadəçi məlumatlarının necə toplandığını, nə üçün
        istifadə edildiyini və necə qorunduğunu izah edir.</p>
      user_data: İstifadəçi məlumatları
      user_data_description: >-
        <p>%{faq_link} səhifəmizdə bu saytın imkanları haqqında
        daha çox məlumat var.</p>
      data_protection_rights: Məlumatların qorunması ilə bağlı hüquqlar
      data_protection_rights_answer: >-
        <p>Hər bir istifadəçinin aşağıdakı hüquqları var:</p><p>Məlumatlara çıxış hüququ —
        İstifadəçilər şəxsi məlumatlarının surətlərini bizdən tələb etmək hüququna malikdirlər.
        Bu xidmət üçün kiçik bir ödəniş tələb edə bilərik.</p><p>Düzəliş hüququ —
        İstifadəçilər yanlış hesab etdikləri məlumatları düzəltməyimizi tələb etmək
        hüququna malikdirlər. Onlar natamam hesab etdikləri məlumatları
        tamamlamağımızı da tələb edə bilərlər.</p><p>Silinmə hüququ — İstifadəçilər
        müəyyən şərtlər daxilində şəxsi məlumatlarını silməyimizi tələb etmək
        hüququna malikdirlər.</p><p>Emalı məhdudlaşdırmaq hüququ — İstifadəçilər
        müəyyən şərtlər daxilində şəxsi məlumatlarının emalını məhdudlaşdırmağımızı
        tələb etmək hüququna malikdirlər.</p><p>Emala etiraz hüququ — İstifadəçilər
        müəyyən şərtlər daxilində şəxsi məlumatlarının tərəfimizdən emalına etiraz
        etmək hüququna malikdirlər.</p><p>Məlumatların daşınması hüququ — İstifadəçilər
        müəyyən şərtlər daxilində topladığımız məlumatları başqa bir təşkilata və ya
        birbaşa özlərinə ötürməyimizi tələb etmək hüququna malikdirlər.</p><p>Sorğu
        göndərildikdə sizə cavab vermək üçün bir ay vaxtımız var.</p>
      cookies: Kukilərdən istifadə
      cookies_description: >-
        <p>Bu veb-sayt ziyarət zamanı istifadəçi təcrübəsini yaxşılaşdırmaq üçün
        kukilərdən istifadə edir. Funksional kukilər kimliyin təsdiqlənməsi və
        əvvəllər seçilmiş parametrlərin yadda saxlanması üçün istifadə olunur.
        Bunlara üstünlük verdiyiniz dil və olduğunuz məkan daxil ola bilər.
        Uyğun hallarda bu sayt ilk ziyarətdə istifadəçiyə kompüterində və ya
        cihazında kukilərin istifadəsinə icazə vermək və ya verməmək imkanı
        yaradan kuki idarəetmə sistemindən istifadə edir.</p><p>Kukilər istifadəçinin
        kompüterinin sərt diskində saxlanan kiçik fayllardır. Onlar istifadəçinin
        saytla qarşılıqlı əlaqəsi və saytdan istifadəsi barədə məlumatları izləyir,
        qeyd edir və saxlayır. Bu, saytın öz serveri vasitəsilə istifadəçilərə
        fərdiləşdirilmiş təcrübə təqdim etməsinə imkan verir.</p><p> İstifadəçilər
        bu saytdan kukilərin istifadəsini və kompüterlərinin sərt diskində
        saxlanmasını istəmirlərsə, brauzerlərinin təhlükəsizlik parametrlərində
        bu saytdan və onun xarici xidmət təminatçılarından gələn bütün kukiləri
        bloklamaq üçün lazımi addımları atmalıdırlar.</p>
      social_media: Sosial media platformaları
      social_media_description: >-
        <p>Bu saytın iştirak etdiyi xarici sosial media platformalarında
        ünsiyyət, qarşılıqlı əlaqə və fəaliyyətlər müvafiq sosial media
        platformasının şərtlərinə və məxfilik siyasətinə tabedir.</p>
      changes: Dəyişikliklər
      changes_description: >-
        <p>Məxfilik siyasətimizi müntəzəm nəzərdən keçirir və bütün yenilikləri
        bu səhifədə yerləşdiririk. Kanadanın Şəxsi Məlumatların Qorunması və
        Elektron Sənədlər Aktına (PIPEDA) və Avropa İttifaqının Ümumi Məlumatların
        Qorunması Reqlamentinə (GDPR EU) uyğunluğu təmin edirik.</p><p>Bu məxfilik
        siyasəti sonuncu dəfə 11 fevral 2024-cü ildə yenilənib.</p>
      contact: Bizimlə əlaqə
      contact_description: >-
        <p class="noMarginBottom">Sualınız və ya narahatlığınız varsa,
        zəhmət olmasa, %{email_link}.</p>
