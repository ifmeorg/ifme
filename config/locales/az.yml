    label:
      one: 'Üsul:'
      other: 'Üsullar:'
    index:
      subtitle: >-
        Anlarına münasibətdə arzuladığın düşüncə və yanaşmalara çatmaq üçün
        özünə qayğı üsulları hazırla.
      premade1_name: Beş dəqiqəlik meditasiya
      premade1_description: >-
        1) <b>Rahat bir vəziyyət al.</b> Stulda və ya yerdə yastığın üstündə
        otura bilərsən. Kürəyini dik tut, amma özünü gərmə. Əllərini rahat
        olduqları yerə qoy. Dilini damağında və ya sənə rahat olan yerdə saxla.
        <br /><br />2)<b>Bədənini hiss et və rahatlat.</b> Bədəninin formasını
        və ağırlığını hiss etməyə çalış. Özünə rahatlamağa imkan ver və burada
        oturan bədəninə maraqla diqqət yetir — duyğularına, toxunuşlara,
        döşəmə və ya stulla təmasına. Gərginlik hiss etdiyin yerləri rahatlat.
        Sadəcə nəfəs al.<br
        /><br />3) <b>Diqqətini nəfəsinə yönəlt.</b> Nəfəsinin təbii axınını hiss et —
        nəfəs al, nəfəs ver. Nəfəsini dəyişməyə ehtiyac yoxdur. Nə uzun,
        nə qısa, sadəcə təbii. Nəfəsini bədəninin harasında hiss etdiyinə
        diqqət yetir. Bu, qarnında, sinəndə, boğazında və ya burun dəliklərində
        ola bilər. Hər nəfəsin yaratdığı duyğunu bir-bir hiss etməyə çalış.
        Bir nəfəs bitəndə növbətisi başlayır.<br /><br />4)
        <b>Fikrin yayınanda özünə mehriban davran.</b> Bunu edərkən fikrinin
        yayınmağa başladığını hiss edə bilərsən. Başqa şeylər haqqında
        düşünməyə başlaya bilərsən. Belə olsa, narahat olma. Bu, çox təbiidir.
        Sadəcə fikrinin yayındığını fərq et. Öz-özünə yumşaq bir şəkildə
        “düşünürəm” və ya “fikrim yayınıb” deyə bilərsən. Sonra diqqətini
        asta-asta yenidən nəfəsinə yönəlt. <br /><br />5) <b>Beş-yeddi dəqiqə
        bu vəziyyətdə qal. </b> Sakitlikdə nəfəsinə diqqət yetir. Arabir
        düşüncələrə dalacaqsan, sonra yenidən nəfəsinə qayıdacaqsan.<br /><br />6)
        <b>Bitirməzdən əvvəl özünü yoxla. </b> Bir neçə dəqiqədən sonra burada
        oturan bədəninə, bütün bədəninə yenidən diqqət yetir. Özünə daha da
        rahatlamağa imkan ver və bu gün bu məşqi etdiyin üçün özünə təşəkkür et.
        <br /><br /><i>Götürüldüyü mənbə:
        http://www.mindful.org/a-five-minute-breathing-meditation/ </i>
      instructions: >-
        Hələ öz üsullarını yaratmamısan.<br />Aşağıdakı hazır üsulu
        da əlavə edib sonra özünə uyğunlaşdıra bilərsən.
