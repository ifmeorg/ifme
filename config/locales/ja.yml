  omniauth:
    access_denied: 'アクセスが拒否されました'
  pages:
    about:
      main_message_one: '%{app_name}は、こころの健康についての経験を、信頼できる味方と分かち合うことを応援するコミュニティです。'
      message_text_one: '信頼できる味方とは、友だち、家族、職場の人、先生、支援の専門職など、毎日関わる人たちのことです。'
      main_message_two: 'こころの健康と向き合うのは、人として自然なことです。でも、それを人に話すのは、多くの人にとって難しいことです。'
      message_text_two: '誰もがカウンセラーやセラピストではありません。私たちの感情や行動は、毎日関わる人たちによって形づくられます。その人たちに回復の歩みに関わってもらうことが、回復への鍵です。'
      message_text_three: '<strong>資金面で応援しませんか？</strong>2016年に Linebreak からコミュニティの助成を受け、2017年に %{fund_club_link} から資金を受けました。%{open_collective_link} への寄付で応援していただけます。'
      fund_club: Fund Club
    blog:
      description: '私たちのブログに書いてみたい方は、%{email} まで企画をお送りください。匿名での投稿も歓迎します。'
    contribute:
      contributor_avatar_alt: '%{name}さんの紹介'
      message_text_one: '<strong>こころの健康を支える活動をしている方</strong>、<strong>医療・福祉の専門職の方</strong>、<strong>ソフトウェア開発者</strong>、<strong>翻訳者</strong>、<strong>UX デザイナー</strong>など、どなたのアイデアもいつでも歓迎します！<p class="noMarginBottom">%{email_link}ください。こちらからご連絡します。主な連絡手段である %{slack_link} にご招待します。%{github_link} のリポジトリのフォークもお忘れなく！</p>'
      more_contributors: 'ほかにも素晴らしい協力者のみなさん！'
      thanks: '心から感謝します'
      slack: Slack
    faq:
      title: 'よくある質問'
      data_access_question: '私のデータは誰が見られますか？'
      data_access_answer: 'データを第三者に渡したり、見られるようにしたりすることはありません。アカウントを削除すると、すべてのデータが消えます。<br /><br />あなたに合ったおすすめを出すため、ユーザーのデータはサイトの中で分析されます。<br /><br />アカウントを作るには、名前とメールアドレスが必要です。Facebook か Google でログインした場合は、そのプロフィール写真と名前がアカウントに使われます。'
      moment_question: 'できごととは何ですか？'
      moment_answer: '<strong>%{moment}</strong>とは、こころの健康に影響する出来事や状況のことです。良いことでも、つらいことでもかまいません。日記やつぶやきのようなものと考えてください。<br /><br />できごとには、対処法・カテゴリー・気分のタグを付けられます。どの味方が見てコメントできるかも選べます。自分だけが見られるようにもできます。<br /><br /><strong>%{moment_templates}</strong>を使うと、くり返し使える書き出しを作れます。'
      strategy_question: '対処法とは何ですか？'
      strategy_answer: '<strong>%{strategy}</strong>とは、つらさをやわらげたり、回復に向かったりするのに役立つ活動や考え方、セルフケアのことです。<br /><br />対処法には、カテゴリーのタグを付けられます。どの味方が見てコメントできるかも選べます。自分だけが見られるようにもできます。共有した対処法は、指定したすべての味方に表示されるので、味方は自分のできごとにあなたの対処法のタグを付けられます！'
      category_question: 'カテゴリーとは何ですか？'
      category_answer: '<strong>%{category}</strong>とは、あなたにとって大切な人・場所・ものを表すタグです。'
      mood_question: '気分とは何ですか？'
      mood_answer: '<strong>%{mood}</strong>とは、心の状態や気持ち、感情を表すタグです。'
      group_question: 'グループとは何ですか？'
      group_answer: '<strong>%{group}</strong>は、こころの健康について支え合い、相談し、話し合う場です。グループを作ると、味方が参加できるようになります。参加できるのは、味方が作ったグループだけです。<br /><br />グループのリーダーは<strong>ミーティング</strong>を作れます。ミーティングには場所と時間があります。場所は住所でも、ビデオ会議の URL でもかまいません。ミーティングにはコメントもできます。グループのリーダーは、ほかにリーダーがいないとグループから退出できません。グループを削除できるのは、メンバーがあなた一人のときだけです。'
      medications_question: 'お薬の機能はどう使いますか？'
      medications_answer: '<strong>%{medications}</strong>の機能では、飲んでいる処方薬を記録できます。症状の記録もできます。'
      care_plan_question: 'セルフケアプランの機能はどう使いますか？'
      care_plan_answer: '<strong>%{care_plan}</strong>の機能では、つらいときに連絡したい大切な人の一覧を作り、お気に入りのセルフケアの対処法をブックマークしておけます。'
      invite_question: '大切な人をアプリに招待するには？'
      invite_answer: '<strong>%{allies}</strong>のページで「大切な人を招待しましょう」のリンクを押すと、メールで招待できます。招待が受け入れられると、その人があなたの味方の一覧に加わります。'
      email_notifications_question: 'メールのお知らせを変えるには？'
      email_notifications_answer: '<strong>%{accounts}</strong>のページで、メールアドレス、パスワード、プロフィール写真、自己紹介を変えられます。アカウントの削除もここでできます。アカウントを削除すると、すべてのデータが消えます。'
    home:
      update_pwd_modal:
        title: 'パスワードを更新してください'
        body: 'ユーザーのみなさんを守るため、安全対策を強めました。%{update_password_link}'
        update_link: 'パスワードを更新してください。'
      stories: 'みんなの話'
      not_signed_in:
        main_message_one: '大切な人ともっと話せると、こころの健康も良くなります。'
        message_text_one: '偏見をなくすには、お互いの支えが必要です。'
        message_one: '自分の話を大切な人と分かち合い、あなたにふさわしい支えを受けましょう'
        message_two: '安全とプライバシーを守りながら、気負わずにありのままで'
        message_three: '気分、お薬、セルフケアを記録しましょう'
        main_message_two: 'こころの健康はオープンであるべきだから、私たちはオープンソースです。'
        message_text_two: '%{help}と%{feedback}を、<strong>いつでも</strong>お待ちしています！'
        help: 'ご協力'
      signed_in_empty:
        main_message_one: '%{name}さん、こんにちは！'
        message_text_one: '自分の話を分かち合う始め方はこちらです。'
        main_message_two: 'あなたのことを教えてください。'
        cell_one: '%{profile}を整えましょう。自己紹介とプロフィール写真を追加します<br />気持ちにぴったりの%{moods}を追加しましょう<br />%{allies}を追加しましょう。分かち合いたい友だち、家族などです'
        main_message_three: 'あなたの話を書きましょう。'
        cell_two: 'できごとを整理するための%{categories}を作りましょう<br />%{moments}、つまりこころの健康に影響した出来事や状況について書きましょう'
        main_message_four: '自分をいたわりましょう。'
        cell_three: 'セルフケアの計画を%{strategize}！<br />%{medications}を飲んでいますか？記録して、お知らせを設定しましょう！<br />もっと支えがほしいときは、%{group}に参加するか作って、話してみましょう'
        main_message_five: 'ご質問やご心配はありますか？'
        message_text_three: '%{faq}のページをご覧いただくか、%{email_link}ください！'
        strategize: '立てましょう'
    partners:
      description: '私たちが刺激を受け、一緒に活動させていただいた素晴らしい団体のみなさんです。あなたの団体ともぜひご一緒したいと思っています。%{email} までご連絡ください。'
    privacy:
      summary: '概要'
      summary_description: '<p>このプライバシーポリシーは、このウェブサイトと、このサイトを使うユーザーのプライバシーについて定めるものです。</p><p>このサイトは繊細な内容を扱うため、プライバシーは私たちにとってとても大切なことです。このポリシーでは、ユーザーのデータをどう集め、何に使い、どう守るかを説明します。</p>'
      user_data: 'ユーザーのデータ'
      user_data_description: '<p>このサイトの機能について詳しくは %{faq_link} のページをご覧ください。</p>'
      data_protection_rights: 'データ保護の権利'
      data_protection_rights_answer: '<p>すべてのユーザーに、次の権利があります。</p><p>アクセスの権利：ユーザーは、自分の個人データの写しを求めることができます。この手続きには少額の手数料をいただくことがあります。</p><p>訂正の権利：ユーザーは、不正確だと思う情報の訂正を求めることができます。また、不完全だと思う情報を補うよう求めることもできます。</p><p>消去の権利：ユーザーは、一定の条件のもとで、自分の個人データの消去を求めることができます。</p><p>処理を制限する権利：ユーザーは、一定の条件のもとで、自分の個人データの処理を制限するよう求めることができます。</p><p>処理に異議を述べる権利：ユーザーは、一定の条件のもとで、自分の個人データの処理に異議を述べることができます。</p><p>データポータビリティの権利：ユーザーは、一定の条件のもとで、私たちが集めたデータを別の組織か本人に移すよう求めることができます。</p><p>お求めがあった場合、私たちは1か月以内にお返事します。</p>'
      cookies: 'Cookie の使用'
      cookies_description: '<p>このウェブサイトは、訪れたユーザーの体験を良くするために Cookie を使います。機能のための Cookie は、ログインと、以前に選んだ設定（使う言語や地域など）を覚えておくために使います。必要に応じて、初めて訪れたユーザーが、自分のコンピューターや端末での Cookie の使用を許可するか拒否するかを選べる仕組みを使います。</p><p>Cookie は、ユーザーのコンピューターに保存される小さなファイルで、サイトでの操作や使い方についての情報を記録・保存します。これにより、ウェブサイトはサーバーを通じて、ユーザーに合わせた体験を提供できます。</p><p>このウェブサイトとその外部の配信業者からの Cookie の使用と保存を拒否したい場合は、ブラウザーのセキュリティの設定で、このサイトとその外部の配信業者からのすべての Cookie をブロックしてください。</p>'
      social_media: 'ソーシャルメディア'
      social_media_description: '<p>このウェブサイトが参加している外部のソーシャルメディアでのやりとり・交流・操作には、それぞれのソーシャルメディアの利用規約とプライバシーポリシーが適用されます。</p>'
      changes: '変更'
      changes_description: '<p>私たちはプライバシーポリシーを定期的に見直し、変更はこのページに掲載します。カナダの個人情報保護および電子文書法（PIPEDA）と、欧州連合の一般データ保護規則（GDPR）に従っています。</p><p>このプライバシーポリシーの最終更新日は2024年2月11日です。</p>'
      contact: 'お問い合わせ'
      contact_description: '<p class="noMarginBottom">ご質問やご心配があれば、%{email_link}ください。</p>'
