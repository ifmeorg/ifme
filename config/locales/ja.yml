    index:
      subtitle: 'できごとに対して望む考え方や向き合い方ができるよう、セルフケアの対処法を考えましょう。'
      premade1_name: '5分間の瞑想'
      premade1_description: '1) <b>リラックスできる楽な姿勢をとります。</b>椅子に座っても、床のクッションに座ってもかまいません。背すじは伸ばしますが、力を入れすぎないように。手は楽なところに置きます。舌は上あごにつけるか、楽な位置に。<br /><br />2) <b>体に気づき、ゆるめます。</b>体の形や重さに気づいてみましょう。体をゆるめ、ここに座っている体に興味を向けます。感じている感覚、触れているもの、床や椅子との接点。こわばったところや緊張しているところをゆるめます。ただ呼吸します。<br /><br />3) <b>呼吸に意識を向けます。</b>吸って、吐いて。自然な呼吸の流れを感じます。呼吸を変えようとしなくてかまいません。長くも短くもなく、自然なままで。体のどこで呼吸を感じるかに気づきます。おなかかもしれません。胸やのど、鼻かもしれません。一回ずつ、呼吸の感覚を感じられるか試してみましょう。ひとつの呼吸が終わると、次の呼吸が始まります。<br /><br />4) <b>さまよう心にやさしく。</b>こうしていると、心がさまよい始めることに気づくかもしれません。ほかのことを考え始めるかもしれません。そうなっても問題ありません。とても自然なことです。心がさまよったことに、ただ気づきます。心の中でそっと「考えている」「さまよっている」と言ってもかまいません。そして、やさしく注意を呼吸に戻します。<br /><br />5) <b>5〜7分ほど、このまま続けます。</b>静かに呼吸に気づきます。ときどき考えごとに入りこんでも、また呼吸に戻ります。<br /><br />6) <b>終える前に、もう一度体に気づきます。</b>数分たったら、ここに座っている体、体全体にもう一度気づきます。さらに深くゆるめ、今日この練習をした自分に感謝しましょう。<br /><br /><i>出典：http://www.mindful.org/a-five-minute-breathing-meditation/ </i>'
      instructions: 'まだ自分の対処法を作っていません。<br />下の用意された対処法を追加して、あとで自分に合わせて変えることもできます。'
