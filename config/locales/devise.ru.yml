ru:
  devise:
    confirmations:
      confirmed: 'Ваш адрес почты подтверждён.'
      send_instructions: >-
        В течение нескольких минут вы получите письмо с инструкциями по
        подтверждению адреса почты.
      send_paranoid_instructions: >-
        Если ваш адрес почты есть в нашей базе, в течение нескольких минут вы
        получите письмо с инструкциями по его подтверждению.
    failure:
      already_authenticated: 'Вы уже вошли.'
      inactive: 'Ваш аккаунт ещё не активирован.'
      invalid: 'Неверный %{authentication_keys} или пароль.'
      locked: 'Ваш аккаунт заблокирован.'
      last_attempt: 'У вас осталась одна попытка, после неё аккаунт будет заблокирован.'
      not_found_in_database: 'Неверный %{authentication_keys} или пароль.'
      timeout: 'Сеанс истёк. Войдите снова, чтобы продолжить.'
      unauthenticated: 'Чтобы продолжить, войдите или зарегистрируйтесь.'
      unconfirmed: 'Чтобы продолжить, подтвердите адрес почты.'
    mailer:
      confirmation_instructions:
        subject: 'if-me.org | Инструкции по подтверждению'
      reset_password_instructions:
        subject: 'if-me.org | Инструкции по сбросу пароля'
      unlock_instructions:
        subject: 'if-me.org | Инструкции по разблокировке'
      password_change:
        subject: 'if-me.org | Пароль изменён'
    omniauth_callbacks:
      failure: 'Не удалось войти через %{kind}: «%{reason}».'
      success: 'Вы вошли через аккаунт %{kind}.'
    passwords:
      no_token: >-
        Эта страница открывается только по ссылке из письма для сброса пароля.
        Если вы перешли по ссылке из такого письма, проверьте, что использовали
        полный URL.
      send_instructions: >-
        В течение нескольких минут вы получите письмо с инструкциями по сбросу
        пароля.
      send_paranoid_instructions: >-
        Если ваш адрес почты есть в нашей базе, в течение нескольких минут на
        него придёт ссылка для восстановления пароля.
      updated: 'Пароль изменён. Вы вошли в аккаунт.'
      updated_not_active: 'Пароль изменён.'
    registrations:
      destroyed: >-
        До свидания! Ваш аккаунт удалён. Надеемся скоро увидеться с вами
        снова.
      signed_up: 'Добро пожаловать! Вы зарегистрировались.'
      signed_up_but_inactive: >-
        Вы зарегистрировались, но войти пока не получится: ваш аккаунт ещё не
        активирован.
      signed_up_but_locked: >-
        Вы зарегистрировались, но войти не получится: ваш аккаунт
        заблокирован.
      signed_up_but_unconfirmed: >-
        Мы отправили на вашу почту письмо со ссылкой для подтверждения.
        Перейдите по ней, чтобы активировать аккаунт.
      update_needs_confirmation: >-
        Аккаунт обновлён, но нужно подтвердить новый адрес почты. Проверьте
        почту и перейдите по ссылке в письме, чтобы подтвердить новый адрес.
      updated: 'Аккаунт обновлён.'
    sessions:
      signed_in: 'Вы вошли.'
      signed_out: 'Вы вышли из аккаунта.'
      already_signed_out: 'Вы вышли из аккаунта.'
    unlocks:
      send_instructions: >-
        В течение нескольких минут вы получите письмо с инструкциями по
        разблокировке аккаунта.
      send_paranoid_instructions: >-
        Если такой аккаунт существует, в течение нескольких минут вы получите
        письмо с инструкциями по его разблокировке.
      unlocked: 'Аккаунт разблокирован. Войдите, чтобы продолжить.'
  errors:
    messages:
      already_confirmed: 'уже подтверждён, попробуйте войти'
      confirmation_period_expired: 'нужно подтвердить за %{period}, запросите новое письмо'
      expired: 'больше не действует, запросите новую ссылку'
      not_found: 'не найден'
      not_locked: 'не был заблокирован'
      not_saved:
        one: 'Не удалось сохранить %{resource} из-за 1 ошибки:'
        few: 'Не удалось сохранить %{resource} из-за %{count} ошибок:'
        many: 'Не удалось сохранить %{resource} из-за %{count} ошибок:'
        other: 'Не удалось сохранить %{resource} из-за %{count} ошибок:'
      pwned_password: >-
        уже встречался в утечках данных, поэтому его нельзя использовать. Если
        вы где-то им пользовались, срочно смените его!
